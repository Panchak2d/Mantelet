name: Bug report
description: The code, the tests, or the docs checker does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach any image of a person. Do not paste passwords or keys.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Say what you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Your system
      description: Operating system and Python version, for example "EndeavourOS, Python 3.13".
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no images of people and no abusive material.
          required: true
